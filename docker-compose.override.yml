# Local-development overrides, auto-loaded by a bare `docker compose up`.
#
# The base docker-compose.yml is production-shaped: api/consumer run the immutable
# image's baked code (no source mount, no --reload), so the same file the server
# deploys is what you build here. This file restores the dev niceties - hot reload
# and live-mounted source - for local work only.
#
# Production runs `-f docker-compose.yml -f docker-compose.prod.yml` explicitly,
# which does NOT auto-load this file, so these overrides never reach the server.
services:
  api:
    # Hot-reload the bind-mounted source instead of running the image's baked CMD.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      # Force file-watch polling so --reload works across the Windows/WSL mount.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app          # local edits reflect live in the container
      - ./alembic:/app/alembic  # autogenerated migrations land back on the host

  consumer:
    volumes:
      - ./app:/app/app          # live source for the worker too
