# HireSignal local stack. Bring it up with:  docker compose up --build
# Bring it fully down (destroy data):        docker compose down -v

services:
  api:
    build: .
    image: hiresignal-api      # tag it so the consumer can reuse this exact image
    container_name: hiresignal_api
    # Override the image's production CMD with hot-reload for local dev.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      # Force file-watch polling so --reload works across the Windows/WSL mount.
      WATCHFILES_FORCE_POLLING: "true"
      HF_HOME: /app/.cache/huggingface   # where the embedding model is cached
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app          # local edits are reflected live in the container
      - ./alembic:/app/alembic  # autogenerated migrations land back on the host
      - ./.cache/huggingface:/app/.cache/huggingface  # persist the embedding model (~90MB)
      - ./chroma_data:/app/chroma_data                # persist the vector store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - hiresignal

  postgres:
    image: postgres:16-alpine
    container_name: hiresignal_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"             # exposed so tools (e.g. Power BI) can connect later
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hiresignal

  redis:
    image: redis:7-alpine
    container_name: hiresignal_redis
    ports:
      # Host 16379 avoids Windows' reserved 5944-6443 range; container port stays 6379.
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hiresignal

  minio:
    image: minio/minio:latest
    container_name: hiresignal_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console -> http://localhost:9001
    volumes:
      - miniodata:/data
    networks:
      - hiresignal

  prometheus:
    image: prom/prometheus:latest
    container_name: hiresignal_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI -> http://localhost:9090
    networks:
      - hiresignal

  grafana:
    image: grafana/grafana:latest
    container_name: hiresignal_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana -> http://localhost:3000 (admin/admin)
    depends_on:
      - prometheus
    networks:
      - hiresignal

  kafka:
    image: apache/kafka:3.8.0
    container_name: hiresignal_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3          # new topics get 3 partitions
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    networks:
      - hiresignal

  consumer:
    # Reuse the api image (identical build) instead of building a second torch
    # image - saves build time and a lot of disk on a small server.
    image: hiresignal-api
    container_name: hiresignal_consumer
    command: python -m app.workers.consumer
    env_file: .env
    environment:
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./app:/app/app
      - ./.cache/huggingface:/app/.cache/huggingface
      - ./chroma_data:/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - hiresignal

  mailpit:
    image: axllent/mailpit:latest
    container_name: hiresignal_mailpit
    ports:
      - "8025:8025"   # web inbox -> http://localhost:8025
      - "1025:1025"   # SMTP
    networks:
      - hiresignal

  # R3 frontend (Next.js) - DEV mode with live reload, started by the default
  # `docker compose up`. The source is bind-mounted and `next dev` watches it
  # (file polling, since this is a Windows bind mount), so your edits refresh in
  # the browser with no rebuild - the same pattern as the api service. The browser
  # reaches the API on the host at :8000.
  frontend:
    build:
      context: ./frontend
      target: deps            # image with node_modules; the app code comes from the mount
    container_name: hiresignal_frontend
    # Use the webpack dev bundler (not Turbopack): only webpack honors
    # WATCHPACK_POLLING, and polling is what makes file-watching work across a
    # Windows Docker bind mount (Turbopack's native watcher misses those events).
    command: sh -c "npm run dev -- -H 0.0.0.0 --webpack"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"     # poll for file changes across the Windows mount
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"   # http://localhost:3001
    volumes:
      - ./frontend:/app       # live source
      - /app/node_modules     # keep the image's Linux node_modules (mask the host's)
      - /app/.next            # keep the dev build cache inside the container
    depends_on:
      - api
    networks:
      - hiresignal

  # Frozen PRODUCTION build of the frontend (opt-in), on :3002 so it never clashes
  # with the dev frontend. Rebuild after code changes:
  #   docker compose --profile prod build frontend-prod
  #   docker compose --profile prod up -d frontend-prod
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    container_name: hiresignal_frontend_prod
    ports:
      - "3002:3001"   # http://localhost:3002
    depends_on:
      - api
    networks:
      - hiresignal

volumes:
  pgdata:
  redisdata:
  miniodata:
  prometheusdata:
  grafanadata:

networks:
  hiresignal:
    driver: bridge
