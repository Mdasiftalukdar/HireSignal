name: CI

# Pull requests are gated here. Pushes to main are handled by deploy.yml, whose
# own `test` job runs the same suite before building and deploying - so pytest
# isn't run twice on a main push.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
